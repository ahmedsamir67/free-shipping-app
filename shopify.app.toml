# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5ca3ba6860c6cc39c021129bfc4cc307"
name = "free-shipping-app"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# The checkout UI extension itself needs none of these: it runs on Shopify's
# infrastructure and calls no Admin API. These scopes exist for the Admin
# GraphiQL client that `shopify app dev` serves, which is a development tool
# and not part of what the extension does at runtime.
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_orders,write_orders,read_customers,write_customers"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
